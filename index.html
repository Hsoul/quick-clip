<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Clip v2.2</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f4f4f9; }
    h2 { color: #333; text-align: center; margin-bottom: 5px; }
    textarea { width: 100%; height: 120px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 8px; background: #007aff; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:active { opacity: 0.8; }
    .copy-btn { background: #34c759; margin-top: 8px; padding: 8px; font-size: 14px; color: white; }
    .card { background: white; padding: 15px; margin-top: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); word-break: break-all; }
    #status { font-size: 13px; color: #34c759; text-align: center; margin-top: 10px; font-weight: bold; }
    #version-tag { font-size: 11px; color: #8e8e93; text-align: center; margin-top: 4px; }
  </style>
</head>
<body>

  <h2>Quick Clip 📋</h2>
  <textarea id="inputText" placeholder="Вставьте текст или скопируйте отсюда..."></textarea>
  <button id="sendBtn" onclick="sendClip()">Отправить в буфер</button>
  
  <div id="status">🟢 Готово к работе</div>
  <div id="version-tag">Версия v2.2</div>

  <div id="clipsList"></div>

  <script>
    // Точные исходные параметры подключения
    const SUPABASE_URL = 'https://vnzgdrqupislieaonpic.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8I-2Kz4A1IdTy4KsJRKF_g_UnxIQ8MW';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function sendClip() {
      const btn = document.getElementById('sendBtn');
      const text = document.getElementById('inputText').value;
      if (!text.trim()) return;

      btn.innerText = 'Отправка...';

      const { data, error } = await supabase.from('clips').insert([{ content: text }]);

      if (error) {
        alert('Ошибка от Supabase: ' + JSON.stringify(error));
        btn.innerText = 'Ошибка отправки';
        btn.style.background = '#ff3b30';
      } else {
        document.getElementById('inputText').value = '';
        btn.innerText = 'Отправлено ✔';
        btn.style.background = '#34c759';
        
        setTimeout(() => {
          btn.innerText = 'Отправить в буфер';
          btn.style.background = '#007aff';
        }, 2000);
        
        loadClips();
      }
    }

    async function loadClips() {
      const list = document.getElementById('clipsList');
      const { data, error } = await supabase
        .from('clips')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('status').innerText = '🔴 Ошибка базы данных';
        document.getElementById('status').style.color = '#ff3b30';
        list.innerHTML = `<div class="card" style="color:red;">Ошибка загрузки: ${error.message}</div>`;
        return;
      }

      document.getElementById('status').innerText = '🟢 Подключение работает';
      document.getElementById('status').style.color = '#34c759';

      if (!data || data.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#999; margin-top:20px;">Буфер пуст</p>';
        return;
      }

      list.innerHTML = data.map(c => `
        <div class="card">
          <div>${escapeHtml(c.content)}</div>
          <button class="copy-btn" onclick="copyText('${escapeHtml(c.content).replace(/'/g, "\\'")}')">Скопировать</button>
        </div>
      `).join('');
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert('Скопировано в буфер!');
      }).catch(err => {
        alert('Не удалось скопировать: ' + err);
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Автоматическое обновление данных на ПК при отправке с телефона
    supabase
      .channel('public:clips')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'clips' }, () => {
        loadClips();
      })
      .subscribe();

    // Старт
    loadClips();
  </script>
</body>
</html>
