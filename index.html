<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Clip v2.6</title>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f4f4f9; }
    h2 { color: #333; text-align: center; margin-bottom: 5px; }
    textarea { width: 100%; height: 120px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; padding: 14px; margin-top: 10px; border: none; border-radius: 8px; background: #007aff; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:active { opacity: 0.8; }
    .copy-btn { background: #34c759; margin-top: 8px; padding: 8px; font-size: 14px; color: white; }
    .card { background: white; padding: 15px; margin-top: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); word-break: break-all; }
    #status { font-size: 13px; color: #ff9f0a; text-align: center; margin-top: 10px; font-weight: bold; }
    #version-tag { font-size: 11px; color: #8e8e93; text-align: center; margin-top: 4px; }
    
    .debug-box { margin-top: 25px; padding: 12px; background: #1c1c1e; color: #30d158; font-family: monospace; font-size: 11px; border-radius: 8px; max-height: 250px; overflow-y: auto; border: 1px solid #3a3a3c; }
    .debug-title { color: #ffd60a; font-weight: bold; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .log-err { color: #ff453a; margin-bottom: 4px;}
    .log-warn { color: #ff9f0a; margin-bottom: 4px;}
    .log-info { color: #64d2ff; margin-bottom: 4px;}
  </style>

  <!-- Глобальный перехватчик ошибок -->
  <script>
    window.logQueue = [];
    function log(msg, type = 'normal') {
      const time = new Date().toLocaleTimeString();
      const logsBox = document.getElementById('debugLogs');
      
      if (!logsBox) {
          window.logQueue.push({ time, msg, type });
          return;
      }
      
      let cls = '';
      if (type === 'err') cls = 'class="log-err"';
      if (type === 'warn') cls = 'class="log-warn"';
      if (type === 'info') cls = 'class="log-info"';
      logsBox.innerHTML += `<div ${cls}>[${time}] ${msg}</div>`;
      logsBox.scrollTop = logsBox.scrollHeight;
    }

    function flushLogs() {
      window.logQueue.forEach(l => {
          let cls = l.type === 'err' ? 'class="log-err"' : l.type === 'warn' ? 'class="log-warn"' : 'class="log-info"';
          document.getElementById('debugLogs').innerHTML += `<div ${cls}>[${l.time}] ${l.msg}</div>`;
      });
      window.logQueue = [];
    }

    window.onerror = function(message, source, lineno, colno, error) {
      log(`💥 СИСТЕМНАЯ ОШИБКА: ${message} (строка ${lineno})`, 'err');
      document.getElementById('status').innerText = '🔴 Критический сбой сети';
      document.getElementById('status').style.color = '#ff3b30';
      return false;
    };

    window.addEventListener("unhandledrejection", function(event) {
      log(`💥 СБОЙ СЕТИ: ${event.reason}`, 'err');
    });
    
    log('🌐 Запуск системы v2.6...', 'info');
  </script>

  <!-- НОВЫЙ ИСТОЧНИК БИБЛИОТЕКИ ОТ CLOUDFLARE -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.43.4/supabase.min.js"></script>

</head>
<body>
  <h2>Quick Clip 📋</h2>
  <textarea id="inputText" placeholder="Вставьте текст или скопируйте отсюда..."></textarea>
  <button id="sendBtn" onclick="sendClip()">Отправить в буфер</button>
  
  <div id="status">⏳ Инициализация v2.6...</div>
  <div id="version-tag">Версия v2.6</div>

  <div id="clipsList"></div>

  <div class="debug-box">
    <div class="debug-title">
      <span>🛠 ТЕСТИРОВЩИК v2.6</span>
      <span style="cursor:pointer; color:#8e8e93;" onclick="clearLogs()">[Очистить]</span>
    </div>
    <div id="debugLogs"></div>
  </div>

  <script>
    flushLogs();
    log('🚀 Экран загружен. Подключение к Cloudflare...', 'info');

    let supabase;
    const SUPABASE_URL = 'https://vnzgdrqupislieaonpic.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8I-2Kz4A1IdTy4KsJRKF_g_UnxIQ8MW';

    function clearLogs() {
      document.getElementById('debugLogs').innerHTML = '';
    }

    async function initApp() {
      try {
        if (typeof window.supabase === 'undefined') {
          throw new Error("Даже Cloudflare заблокирован. Попробуйте включить VPN или мобильный интернет.");
        }
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        log('✅ База успешно подключена!', 'info');
        loadClips();
        setupRealtime();
      } catch (e) {
        log('❌ ОШИБКА ИНИЦИАЛИЗАЦИИ: ' + e.message, 'err');
        document.getElementById('status').innerText = '🔴 Блокировка сети';
        document.getElementById('status').style.color = '#ff3b30';
      }
    }

    async function sendClip() {
      if (!supabase) return log('❌ Отправка невозможна: нет связи', 'err');
      const btn = document.getElementById('sendBtn');
      const text = document.getElementById('inputText').value;
      if (!text.trim()) return;

      btn.innerText = 'Отправка...';
      log('--- ОТПРАВКА ДАННЫХ ---', 'info');

      try {
        const { data, error } = await supabase.from('clips').insert([{ content: text }]).select();
        if (error) {
          log(`❌ БАЗА ОТКЛОНИЛА ЗАПРОС: ${error.message}`, 'err');
          btn.innerText = 'Ошибка';
          btn.style.background = '#ff3b30';
        } else {
          log('✅ Текст сохранен на сервере!', 'info');
          document.getElementById('inputText').value = '';
          btn.innerText = 'Отправлено ✔';
          btn.style.background = '#34c759';
          setTimeout(() => {
            btn.innerText = 'Отправить в буфер';
            btn.style.background = '#007aff';
          }, 2000);
          loadClips();
        }
      } catch (err) {
         log('❌ СБОЙ ЗАПРОСА: ' + err.message, 'err');
      }
    }

    async function loadClips() {
      if (!supabase) return;
      const list = document.getElementById('clipsList');
      try {
        const { data, error } = await supabase.from('clips').select('*').order('created_at', { ascending: false });
        if (error) {
          log('❌ ОШИБКА ЗАГРУЗКИ ТАБЛИЦЫ: ' + error.message, 'err');
          document.getElementById('status').innerText = '🔴 Ошибка доступа';
          document.getElementById('status').style.color = '#ff3b30';
          return;
        }
        document.getElementById('status').innerText = '🟢 Готово к работе';
        document.getElementById('status').style.color = '#34c759';
        
        if (!data || data.length === 0) {
          log('⚠️ Буфер пуст.', 'warn');
          list.innerHTML = '<p style="text-align:center; color:#999; margin-top:20px;">Буфер пуст</p>';
          return;
        }
        
        log(`✅ Загружено ссылок: ${data.length}`, 'info');
        list.innerHTML = data.map(c => `
          <div class="card">
            <div>${escapeHtml(c.content)}</div>
            <button class="copy-btn" onclick="copyText('${escapeHtml(c.content).replace(/'/g, "\\'")}')">Скопировать</button>
          </div>
        `).join('');
      } catch (err) {
         log('❌ КРИТИЧЕСКИЙ СБОЙ: ' + err.message, 'err');
      }
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        log('📋 Текст скопирован!', 'info');
      }).catch(err => log('❌ Ошибка копирования: ' + err, 'err'));
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function setupRealtime() {
      supabase.channel('public:clips')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'clips' }, () => {
          log('🔄 База обновилась, скачиваем...', 'info');
          loadClips();
        }).subscribe();
    }

    // Запускаем всё после проверки сети
    window.addEventListener('load', initApp);

  </script>
</body>
</html>
